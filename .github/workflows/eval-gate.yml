name: Eval Gate
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      golden_limit:
        description: "Optional smoke limit (e.g. 10). Empty = full golden set."
        required: false
        default: ""
concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-and-web:
    name: API tests + web build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: studypilot
          POSTGRES_PASSWORD: studypilot
          POSTGRES_DB: studypilot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U studypilot -d studypilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://studypilot:studypilot@localhost:5433/studypilot
      TEST_DATABASE_URL: postgresql+psycopg://studypilot:studypilot@localhost:5433/studypilot_test
      OPENROUTER_API_KEY: ci-placeholder-not-used
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Create studypilot_test database
        run: |
          PGPASSWORD=studypilot psql -h localhost -p 5433 -U studypilot -d studypilot -c "CREATE DATABASE studypilot_test;" || true
      - name: Install API + migrate
        working-directory: apps/api
        run: |
          python -m pip install -e ".[dev]"
          python -m alembic upgrade head
      - name: pytest (no PDF fixtures required)
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          STUDYPILOT_AUTH_DISABLED: "1"
          ENVIRONMENT: development
        run: python -m pytest -v --tb=short -k "not test_study_retrieval and not test_ooc_question and not test_ingest"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Web build
        working-directory: apps/web
        run: |
          npm ci
          npm run build
  retrieval-gate:
    name: Retrieval gate @ 100%
    runs-on: ubuntu-latest
    needs: api-and-web
    timeout-minutes: 45
    env:
      MIN_RERANK_SCORE: "0.35"
      EVAL_PRECISION_MIN: "1.0"
      EVAL_OOC_MIN: "1.0"
      DATABASE_URL: postgresql+psycopg://studypilot:studypilot@localhost:5433/studypilot
      TEST_DATABASE_URL: postgresql+psycopg://studypilot:studypilot@localhost:5433/studypilot_test
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check PPL PDF fixtures
        id: fixtures
        run: |
          if [ -f "eval/fixtures/ppl/PPL notes.pdf" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip retrieval gate (fixtures not in repo)
        if: steps.fixtures.outputs.present != 'true'
        run: |
          echo "::warning::PPL PDF fixtures missing — skipping 100% retrieval gate in CI."
          echo "Run locally: MIN_RERANK_SCORE=0.35 ./scripts/ci_eval_gate.sh"
          echo "Or add fixtures via Git LFS — see docs/CI_SETUP.md"
      - uses: actions/setup-python@v5
        if: steps.fixtures.outputs.present == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Start Postgres (docker compose)
        if: steps.fixtures.outputs.present == 'true'
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if python -c "import socket; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1',5433)); s.close()"; then
              echo "Postgres ready"; break
            fi
            sleep 2
          done
      - name: Run CI eval gate
        if: steps.fixtures.outputs.present == 'true'
        env:
          GOLDEN_LIMIT: ${{ github.event_name == 'pull_request' && '10' || github.event.inputs.golden_limit }}
        run: |
          sed -i '1s/^\xEF\xBB\xBF//' scripts/ci_eval_gate.sh
          chmod +x scripts/ci_eval_gate.sh
          if [ -z "${GOLDEN_LIMIT}" ]; then unset GOLDEN_LIMIT; fi
          for i in $(seq 1 30); do
            if PGPASSWORD=studypilot psql -h 127.0.0.1 -p 5433 -U studypilot -d studypilot -c "SELECT 1" >/dev/null 2>&1; then
              echo "Postgres accepting connections"; break
            fi
            sleep 2
          done
          ./scripts/ci_eval_gate.sh
